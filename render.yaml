services:
  - type: web
    name: tactics-discord-bot
    runtime: node
    buildCommand: cd server && npm install && cd ../web && npm install && npm run build
    startCommand: node server/index.js
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: SERVE_WEB
        value: "true"
      - key: WEB_INTERNAL_PORT
        value: "10001"
      - key: OPENAI_AI_ENABLED
        value: "true"
      - key: OPENAI_MODEL_DIALOGUE
        value: "gpt-5.6-luna"
      - key: OPENAI_MODEL_STRATEGY
        value: "gpt-5.6-terra"
      - key: OPENAI_TIMEOUT_MS
        value: "3500"
      - key: OPENAI_STRATEGY_MIN_INTERVAL_MS
        value: "30000"
      - key: OPENAI_STRATEGY_MAX_CALLS_PER_GAME
        value: "12"
